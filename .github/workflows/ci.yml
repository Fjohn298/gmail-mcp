name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Instalar dependencias (exactas de uv.lock)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest

      - name: requirements.txt sincronizado con uv.lock (lo usa Railway)
        run: |
          uv export --no-dev --no-hashes -o /tmp/requirements.txt
          diff requirements.txt /tmp/requirements.txt
